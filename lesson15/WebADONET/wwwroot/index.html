<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Студенты</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; background:#0d1117; color:#e6edf3; margin:0; padding:24px; }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { text-align:center; }
    table { width:100%; border-collapse:collapse; margin:16px 0; }
    th, td { border:1px solid #30363d; padding:8px 12px; text-align:left; }
    th { background:#161b22; }
    tr:nth-child(even) td { background:#0f141b; }
    .error { color:#ff7b72; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Все студенты</h1>
  <table id="students">
    <thead><tr><th>Id</th><th>Имя</th><th>Фамилия</th><th>Группа</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="error" class="error"></div>
</div>

<script>
  async function loadStudents() {
    try {
      // обращение к маршруту students/all
      const response = await fetch('/students/all');
      if (!response.ok) throw new Error('Статус ответа: ' + response.status);
      const students = await response.json();

      const tbody = document.querySelector('#students tbody');
      tbody.innerHTML = '';
      for (const s of students) {
        const tr = document.createElement('tr');
        for (const value of [s.id, s.firstName, s.lastName, s.groupName]) {
          const td = document.createElement('td');
          td.textContent = value ?? '';
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    } catch (e) {
      document.getElementById('error').textContent = 'Ошибка загрузки данных: ' + e.message;
    }
  }

  loadStudents();
</script>
</body>
</html>
